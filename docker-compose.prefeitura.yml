# Prefeitura (Windows + Docker Desktop): o Firebird é o servidor da rede (172.16.0.21),
# então este arquivo não sobe contêiner de Firebird.
# Uso: docker compose -f docker-compose.prefeitura.yml up -d --build
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./scripts:/srv/scripts
      - ./keys:/srv/keys
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    environment:
      API_TARGET: http://api:8000
    volumes:
      - ./web:/web
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rh_auth
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rh_auth"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
